<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7fb"><title>日语修炼室</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202638;background:#f6f7fb;--p:#6967d9;--line:#e7e9f0;--muted:#858da0}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;cursor:pointer}button:disabled{opacity:.4}.app{max-width:1040px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#e9e8ff;color:var(--p);display:grid;place-items:center;font-size:22px}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#969bad;font-size:10px;margin-top:4px}.save{font-size:11px;color:#4c8b70}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}.tabs button{border:1px solid var(--line);border-radius:10px;background:white;padding:11px 4px;color:#72798b;font-size:12px}.tabs button.active{background:#edecff;border-color:#cfcdff;color:#5e5bd0;font-weight:700}.welcome{background:linear-gradient(120deg,#efeeff,#fff);border:1px solid #e5e3ff;border-radius:16px;padding:20px;margin-bottom:15px}.eyebrow{font-size:10px;letter-spacing:1px;color:#8885d5;font-weight:700}.welcome h2{font-size:23px;margin:8px 0}.welcome p{font-size:12px;color:#838a9d;line-height:1.7;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}.stat span{font-size:11px;color:#858da0}.stat strong{display:block;font-size:24px;margin-top:8px}.stat small{font-size:10px;color:#9da3b1}.panel{margin-bottom:14px}.panel h3{font-size:15px;margin:0 0 13px}.meta{font-size:11px;color:#9299a9;margin-bottom:12px}.flash{background:#faf9ff;border:1px solid #e8e6ff;border-radius:12px;text-align:center;padding:25px 14px}.jp{font-size:25px;line-height:1.65;font-weight:700;overflow-wrap:anywhere;color:#28294a}.romaji{font-size:12px;color:#9297aa;margin-top:7px}.cn{font-size:16px;font-weight:600;color:#5552b8;margin-top:18px}.tip{background:#efefff;color:#6866a6;font-size:12px;line-height:1.7;text-align:left;border-radius:9px;padding:11px;margin-top:13px}.actions,.grades{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:17px}.btn{border:1px solid #e4e6ee;border-radius:8px;background:#fff;color:#70788a;padding:10px 13px;font-size:12px}.primary{background:var(--p);border-color:var(--p);color:white}.again{background:#fff0ee;color:#b76b62}.hard{background:#fff5e8;color:#ad782c}.good{background:#eaf6ef;color:#47896c}.easy{background:#eeefff;color:#5c65b7}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #f0f1f5;padding:13px 0}.row:first-child{border-top:0}.row .main{min-width:0;flex:1}.row strong{font-size:13px;display:block;overflow-wrap:anywhere}.row small{font-size:11px;color:#8b92a4;display:block;margin-top:5px;line-height:1.5}.row .btn{white-space:nowrap;padding:8px;font-size:11px}.muted{font-size:11px;color:#9299a9;line-height:1.7}.list{margin-top:8px}.scene-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.scene-tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;font-size:12px;color:#656d80}.scene-tabs button.active{background:#efeeff;border-color:#ceccff;color:#5d5ad0}.bubble{background:#f4f3ff;border:1px solid #e6e4ff;border-radius:12px;padding:16px}.speaker{font-size:10px;color:#8885d5}.options{display:grid;gap:8px;margin-top:12px}.option{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12px;color:#50586b}.option.chosen{border-color:#9d9aef;background:#f7f6ff}.option.correct{border-color:#9dd0b3;background:#effaf3}.option.wrong{border-color:#e6aaa4;background:#fff4f3}.letter{background:#f0f1f6;border-radius:6px;padding:5px 7px;font-weight:700;font-size:10px}.feedback{font-size:12px;line-height:1.7;padding:11px;border-radius:8px;margin-top:12px;background:#f0faf4;color:#367553}.history-filter{border:1px solid var(--line);padding:8px;border-radius:8px;background:white;color:#747b8e;font-size:11px}.empty{text-align:center;padding:35px 10px;color:#8b92a4;font-size:12px}.footer{text-align:center;font-size:10px;color:#a0a5b3;padding:15px 0 28px}@media(min-width:760px){.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.two .panel{margin-bottom:0}}@media(max-width:480px){.app{padding:13px}.brand h1{font-size:16px}.welcome h2{font-size:21px}.stats{grid-template-columns:repeat(2,1fr)}.jp{font-size:22px}.tabs button{font-size:11px}.row{gap:7px}.row .btn{max-width:94px;white-space:normal}.scene-tabs{grid-template-columns:1fr}.scene-tabs button{text-align:left;padding:11px}}
</style>
</head>
<body><div class="app">
<header class="head"><div class="brand"><div class="logo">日</div><div><h1>日语修炼室</h1><small>JAPANESE STUDY ROOM</small></div></div><span class="save">● 自动保存</span></header>
<nav class="tabs" id="tabs"><button data-tab="today" class="active">今日</button><button data-tab="queue">队列</button><button data-tab="progress">进度</button><button data-tab="history">历史</button><button data-tab="speaking">口语</button></nav>
<main id="view"></main><footer class="footer">日语修炼室 · 日常练习 10 分钟 · 数据保存在当前浏览器</footer>
</div>
<script>
const seed=[
["これをください。","Kore o kudasai.","请给我这个。","购物 / 点餐","これ=这个；を标记动作对象；ください=请给我。"],
["日本語を勉強しています。","Nihongo o benkyou shite imasu.","我正在学习日语。","日常交流","〜ています可表示正在进行或持续状态。"],
["すみません、駅はどこですか。","Sumimasen, eki wa doko desu ka.","不好意思，请问车站在哪里？","旅行 / 问路","すみません=不好意思；駅（えき）=车站；どこ=哪里。"],
["おすすめは何ですか。","Osusume wa nan desu ka.","有什么推荐的吗？","餐厅 / 购物","おすすめ=推荐；何（なん）=什么。"],
["仕事が終わってから、ご飯を食べます。","Shigoto ga owatte kara, gohan o tabemasu.","下班之后吃饭。","日常作息","动词て形 + から = 做完前一件事之后。"],
["日本の寿司が好きです。","Nihon no sushi ga suki desu.","我喜欢日本寿司。","兴趣 / 饮食","表达喜欢常用「名词 + が + 好きです」。"],
["水をお願いします。","Mizu o onegaishimasu.","麻烦给我一杯水。","餐厅","お願いします是礼貌提出请求的表达。"],
["もう一度お願いします。","Mou ichido onegaishimasu.","麻烦再说一遍。","日常交流","もう一度=再一次；没听懂时很实用。"],
["いくらですか。","Ikura desu ka.","多少钱？","购物","いくら用于询问价格。"],
["ゆっくり話してください。","Yukkuri hanashite kudasai.","请说慢一点。","日常交流","ゆっくり=慢慢地；話して是話す的て形。"],
["朝ごはんを食べてから、仕事をします。","Asagohan o tabete kara, shigoto o shimasu.","吃完早饭后工作。","日常作息","食べる的て形是食べて，再接から。"],
["日本語は難しいですが、楽しいです。","Nihongo wa muzukashii desu ga, tanoshii desu.","日语虽然难，但是很有趣。","学习 / 兴趣","ですが连接分句，表示转折。"]
];
const scenarios=[
{id:"food",name:"餐厅点餐",turns:[
["いらっしゃいませ。ご注文は？","Irasshaimase. Gochuumon wa?","欢迎光临。您要点什么？",["これをください。","駅はどこですか。","いくらですか。"],0,"「これをください」可以表示“请给我这个”。"],
["お飲み物はいかがですか。","Onomimono wa ikaga desu ka?","您需要喝点什么吗？",["水をお願いします。","日本語は難しいです。","もう一度行きます。"],0,"「水をお願いします」是礼貌地要一杯水。"],
["ほかに何かございますか。","Hoka ni nanika gozaimasu ka?","还需要别的吗？",["大丈夫です。以上です。","駅はどこですか。","日本人です。"],0,"「以上です」可以表示“就这些”。"]]},
{id:"travel",name:"问路找车站",turns:[
["何かお困りですか。","Nanika okomari desu ka?","您有什么困难吗？",["駅はどこですか。","これをください。","おいしいです。"],0,"问车站在哪里可以说「駅はどこですか」。"],
["まっすぐ行ってください。","Massugu itte kudasai.","请一直往前走。",["ありがとうございます。","いくらですか。","水をください。"],0,"「ありがとうございます」是谢谢的礼貌说法。"],
["わかりましたか。","Wakarimashita ka?","明白了吗？",["はい、わかりました。","寿司が好きです。","朝ごはんです。"],0,"「はい、わかりました」表示“是的，我明白了”。"]]},
{id:"shop",name:"商店购物",turns:[
["何をお探しですか。","Nani o osagashi desu ka?","您在找什么？",["これをください。","仕事をします。","おやすみなさい。"],0,"「これをください」是购物时常用的表达。"],
["こちらは千円です。","Kochira wa sen-en desu.","这个是一千日元。",["もう少し安いものはありますか。","駅はどこですか。","毎日勉強します。"],0,"「もう少し安いもの」表示“再便宜一点的东西”。"],
["袋はいりますか。","Fukuro wa irimasu ka?","需要袋子吗？",["はい、お願いします。","いくらですか。","いただきます。"],0,"「はい、お願いします」可以礼貌地回答需要。"]]}
];
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function fresh(){return {cards:seed.map((s,i)=>({id:i,jp:s[0],romaji:s[1],cn:s[2],scene:s[3],tip:s[4],reps:0,interval:0,ease:2.5,due:today(),status:"new"})),history:[],speed:.85}}
function load(){try{let d=JSON.parse(localStorage.getItem("japanese-room-single-v1"));if(d&&d.cards&&d.cards.length===seed.length)return d}catch(e){}return fresh()}
let data=load(),tab="today",cardIndex=0,show=false,sceneIndex=0,turnIndex=0,choice=null,checked=false,filter="all";
function save(){try{localStorage.setItem("japanese-room-single-v1",JSON.stringify(data))}catch(e){}}
function speak(text){if(!("speechSynthesis"in window)){alert("当前浏览器不支持语音播放，请使用最新版 Safari。");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=data.speed||.85;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;speechSynthesis.speak(u)}
function due(){return data.cards.filter(c=>c.due<=today())}
function review(id,grade){let c=data.cards.find(c=>c.id===id),reps=c.reps,interval=c.interval,ease=c.ease||2.5;if(grade==="again"){reps=0;interval=1;c.status="learning"}else{reps++;interval=reps===1?(grade==="hard"?1:2):reps===2?(grade==="hard"?2:4):Math.max(1,Math.round(interval*(grade==="hard"?1.2:grade==="good"?ease:ease*1.3)));if(grade==="hard")ease=Math.max(1.3,ease-.15);if(grade==="easy")ease=Math.min(3.2,ease+.15);c.status=reps>=3?"mastered":"learning"}Object.assign(c,{reps,interval,ease,due:addDays(interval),last:today()});data.history.unshift({date:today(),time:new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}),jp:c.jp,cn:c.cn,grade,label:{again:"需要重练",hard:"有点困难",good:"记住了",easy:"很熟悉"}[grade]});data.history=data.history.slice(0,1000);save();cardIndex=(cardIndex+1)%data.cards.length;show=false;render()}
function setTab(t){tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function stat(label,value,note){return `<div class="stat"><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`}
function cardHtml(c){return `<div class="row"><div class="main"><strong>${c.jp}</strong><small>${c.cn}<br>${c.scene} · ${c.status==="mastered"?"已掌握":c.due<=today()?"今天复习":"下次："+c.due}</small></div><button class="btn" onclick="openCard(${c.id})">练习</button><button class="btn" onclick="speak(${JSON.stringify(c.jp).replace(/'/g,"&#39;")})">🔊</button></div>`}
function openCard(id){cardIndex=id;show=false;setTab("today")}
function render(){
const mastered=data.cards.filter(c=>c.status==="mastered").length;
const reviewCount=data.history.filter(h=>h.date===today()).length;
const c=data.cards[cardIndex];
let html="";
if(tab==="today"){
html=`<div class="welcome"><div class="eyebrow">YOUR DAILY PRACTICE</div><h2>今天也来练习日语吧。</h2><p>先复习快要遗忘的内容，再学习新的表达。建议每天坚持 10 分钟。</p></div>
<div class="stats">${stat("今日复习",reviewCount,"次复习")}${stat("待复习",due().length,"优先完成")}${stat("已掌握",mastered,"/ "+data.cards.length+" 条")}${stat("累计练习",data.history.length,"次记录")}</div>
<div class="two"><section class="panel"><h3>今日学习卡</h3><div class="meta">表达 ${cardIndex+1} / ${data.cards.length} · ${c.scene}</div><div class="flash"><div class="eyebrow">日语表达</div><div class="jp">${c.jp}</div><div class="romaji">${c.romaji}</div>${show?`<div class="cn">${c.cn}</div><div class="tip">${c.tip}</div>`:`<p class="muted">先读出来，试着回忆中文意思。</p>`}<div class="actions"><button class="btn" onclick="speak(${JSON.stringify(c.jp)})">🔊 听日语</button><button class="btn primary" onclick="show=!show;render()">${show?"隐藏解释":"显示中文与语法"}</button></div></div>${show?`<div class="grades"><button class="btn again" onclick="review(${c.id},'again')">再练一次</button><button class="btn hard" onclick="review(${c.id},'hard')">有点难</button><button class="btn good" onclick="review(${c.id},'good')">记住了</button><button class="btn easy" onclick="review(${c.id},'easy')">很熟悉</button></div>`:""}<div class="actions"><button class="btn" onclick="cardIndex=(cardIndex+data.cards.length-1)%data.cards.length;show=false;render()">← 上一条</button><button class="btn" onclick="cardIndex=(cardIndex+1)%data.cards.length;show=false;render()">下一条 →</button></div></section>
<section class="panel"><h3>今日学习安排</h3><div class="row"><div class="main"><strong>间隔复习</strong><small>优先复习到期内容</small></div><button class="btn" onclick="setTab('queue')">${due().length} 条</button></div><div class="row"><div class="main"><strong>跟读练习</strong><small>听一句、模仿一句</small></div><button class="btn" onclick="speak(${JSON.stringify(c.jp)})">开始</button></div><div class="row"><div class="main"><strong>情景对话</strong><small>餐厅、问路、购物</small></div><button class="btn" onclick="setTab('speaking')">开始</button></div><p class="muted">小建议：先听日语，再看罗马音，然后自己说三遍。</p></section></div>`;
}else if(tab==="queue"){
html=`<div class="welcome"><div class="eyebrow">REVIEW QUEUE</div><h2>学习队列</h2><p>按下次复习日期排序；到期卡片优先复习。</p></div><div class="stats">${stat("今天到期",due().length,"条")}${stat("全部表达",data.cards.length,"条")}${stat("已掌握",mastered,"条")}${stat("累计复习",data.history.length,"次")}</div><section class="panel"><h3>全部表达</h3><div class="list">${data.cards.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(cardHtml).join("")}</div></section>`;
}else if(tab==="progress"){
let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10);return {key:k,label:["日","一","二","三","四","五","六"][d.getDay()],n:data.history.filter(h=>h.date===k).length}});
html=`<div class="welcome"><div class="eyebrow">YOUR PROGRESS</div><h2>学习进度</h2><p>不追求一次全记住，持续复习才是关键。</p></div><div class="stats">${stat("词句总量",data.cards.length,"条")}${stat("已掌握",mastered,"条")}${stat("累计复习",data.history.length,"次")}${stat("今日完成",reviewCount,"次")}</div><section class="panel"><h3>最近 7 天复习次数</h3><div style="display:flex;align-items:end;gap:10px;height:150px">${days.map(d=>`<div style="flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;gap:6px"><small>${d.n||""}</small><div style="height:${Math.max(4,d.n*18)}px;background:#a8a6ed;border-radius:5px 5px 0 0"></div><small>${d.label}</small></div>`).join("")}</div></section><section class="panel"><h3>掌握情况</h3><p class="muted">已掌握 ${mastered} 条 · 学习中 ${data.cards.filter(c=>c.status==="learning").length} 条 · 尚未掌握 ${data.cards.filter(c=>c.status==="new").length} 条</p><div style="height:9px;background:#eceef4;border-radius:9px;overflow:hidden"><div style="height:100%;width:${mastered/data.cards.length*100}%;background:#4c8b70"></div></div></section>`;
}else if(tab==="history"){
let h=data.history.filter(x=>filter==="all"||x.grade===filter);
html=`<div class="welcome"><div class="eyebrow">STUDY HISTORY</div><h2>学习历史</h2><p>查看每次复习的句子和自评结果。记录保存在当前浏览器中。</p></div><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>复习记录</h3><select class="history-filter" onchange="filter=this.value;render()"><option value="all">所有评分</option><option value="again" ${filter==="again"?"selected":""}>需要重练</option><option value="hard" ${filter==="hard"?"selected":""}>有点困难</option><option value="good" ${filter==="good"?"selected":""}>记住了</option><option value="easy" ${filter==="easy"?"selected":""}>很熟悉</option></select></div>${h.length?h.map(x=>`<div class="row"><div class="main"><strong>${x.jp}</strong><small>${x.cn}<br>${x.date} ${x.time}</small></div><span class="muted">${x.label}</span></div>`).join(""):`<div class="empty">还没有复习记录。去「今日」翻开答案并选择掌握程度即可开始记录。</div>`}</section>`;
}else if(tab==="speaking"){
let sc=scenarios[sceneIndex],t=sc.turns[turnIndex];
html=`<div class="welcome"><div class="eyebrow">ROLEPLAY PRACTICE</div><h2>情景口语练习</h2><p>听懂对方说什么，再选择合适的日语回应。</p></div><div class="scene-tabs">${scenarios.map((s,i)=>`<button class="${sceneIndex===i?"active":""}" onclick="sceneIndex=${i};turnIndex=0;choice=null;checked=false;render()">${s.name}</button>`).join("")}</div><section class="panel"><h3>${sc.name} · 第 ${turnIndex+1}/${sc.turns.length} 轮</h3><div class="bubble"><div class="speaker">对方</div><div class="jp" style="font-size:20px">${t[0]}</div><div class="romaji">${t[1]}</div><p class="muted">${t[2]}</p><button class="btn" onclick="speak(${JSON.stringify(t[0])})">🔊 播放日语</button></div><p class="muted" style="margin-top:20px">轮到你回答：</p><div class="options">${t[3].map((o,i)=>`<button class="option ${choice===i?"chosen":""} ${checked&&i===t[4]?"correct":checked&&choice===i?"wrong":""}" onclick="if(!checked){choice=${i};render()}"><span class="letter">${"ABC"[i]}</span>${o}</button>`).join("")}</div>${checked?`<div class="feedback">${choice===t[4]?"回答正确！":"再看一下正确答案。"} ${t[5]}</div>`:""}<div class="actions">${checked?`<button class="btn primary" onclick="turnIndex=(turnIndex+1)%scenarios[sceneIndex].turns.length;choice=null;checked=false;render()">${turnIndex===sc.turns.length-1?"再练一轮":"下一句 →"}</button>`:`<button class="btn primary" ${choice===null?"disabled":""} onclick="checked=true;render()">检查答案</button>`}<button class="btn" onclick="turnIndex=0;choice=null;checked=false;render()">重来</button></div></section><section class="panel"><h3>口语小技巧</h3><p class="muted">如果没听懂，可以说「もう一度お願いします。」(Mou ichido onegaishimasu.)——麻烦再说一遍。</p><button class="btn" onclick="speak('もう一度お願いします。')">🔊 听这句话</button></section>`;
}
document.getElementById("view").innerHTML=html;
}
render();
</script></body></html>
